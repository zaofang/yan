

[[entry]]
rows = "R961"
topic = "`yan-flow` is the one move, last-use and drop analysis: a generic control-flow graph of basic blocks with edges for branches, loop back edges, `break`, `continue`, `match` arms, and exits for `return`, `fail` and `?`; the checker, the elaborator and drop elaboration each lower their own IR to it (RFC 0054 D1)"
sections = "4.2, 5.3"

[[entry]]
rows = "R962"
topic = "Facts are keyed by binding identity assigned at definition: a shadowing `let` or a loop re-bind is a new binding and a name is only a lookup into the current scope (RFC 0054 D2)"
sections = "4.2, 5.3"

[[entry]]
rows = "R963"
topic = "Three facts solved to a fixed point: maybe-moved (a read of a maybe-moved binding is a use after move), live (a last-use move is a read at which the binding is not live, and the witness for the used-again label is the first read found), and maybe-owned with a must-owned companion (a drop flag only where the type has custom `Drop` or is `@linear` and ownership depends on the path); a field taken out of a record leaves it owned with a hole; migrated one client at a time (RFC 0054 D3)"
sections = "4.2, 5.3, 5.4, 10.6"

[[entry]]
rows = "R964"
topic = "Loops are decided by the graph: a read in a loop body is followed by every read reachable around the back edge; there is no separate loop rule, and a program whose E413 result changes is migrated by the lead (RFC 0054 D4)"
sections = "4.2"

