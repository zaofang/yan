[package]
name = "yan-playground"
description = "The browser playground's WebAssembly entry points: views in every surface and runs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json.workspace = true
yan-db.workspace = true
yan-diag.workspace = true
yan-ide.workspace = true
yan-interp.workspace = true
yan-names.workspace = true

# The workspace forbids unsafe code; this crate allows it only for the C-ABI exports the page calls.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
