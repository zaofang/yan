[package]
name = "yan-cg-cranelift"
description = "Debug code generation from yan-mir with Cranelift (M1b)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
cranelift-object = "0.137"
gimli = { version = "0.33", default-features = false, features = ["write"] }
object = { version = "0.40", default-features = false, features = ["write", "read_core", "macho"] }
yan-mir.workspace = true
yan-rt.workspace = true
yan-std.workspace = true

[dev-dependencies]
yan-core.workspace = true
yan-db.workspace = true
yan-ide.workspace = true
yan-interp.workspace = true
yan-opt.workspace = true

# The workspace forbids unsafe code; this crate denies it and allows it only where native code
# meets the host (C-ABI entry points, calling generated code).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
