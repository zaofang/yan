[package]
name = "yong-cg-cranelift"
description = "Debug code generation from yong-mir with Cranelift (M1b)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
yong-mir.workspace = true
yong-rt.workspace = true
yong-std.workspace = true

[dev-dependencies]
yong-core.workspace = true

# The workspace forbids unsafe code; this crate denies it and allows it only where native code
# meets the host (C-ABI entry points, calling generated code).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
