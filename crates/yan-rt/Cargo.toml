[package]
name = "yan-rt"
description = "std support code shared by the interpreter and native code (R561)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
core-math.workspace = true
getrandom = "0.4"
libm.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
regex.workspace = true
unicode-segmentation.workspace = true

# The workspace forbids unsafe code; this crate denies it and allows it only where native code
# meets the host (C-ABI entry points, calling generated code).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
rand_chacha = "0.9"
rand_core = "0.9"
rand_pcg = "0.9"
