[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0 WITH LLVM-exception"
publish = false

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
toml = "1"
salsa = { version = "0.28", default-features = false, features = ["macros", "inventory"] }
core-math = "1.4"
indexmap = "2"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
libm = "0.2"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
regex = "1"
unicode-segmentation = "1"
yan-core = { path = "crates/yan-core" }
yan-diag = { path = "crates/yan-diag" }
yan-interp = { path = "crates/yan-interp" }
yan-check = { path = "crates/yan-check" }
yan-std = { path = "crates/yan-std" }
yan-rt = { path = "crates/yan-rt" }
yan-mir = { path = "crates/yan-mir" }
yan-cg-cranelift = { path = "crates/yan-cg-cranelift" }
yan-hir = { path = "crates/yan-hir" }
yan-yag = { path = "crates/yan-yag" }
yan-elab = { path = "crates/yan-elab" }
yan-yn = { path = "crates/yan-yn" }
yan-names = { path = "crates/yan-names" }
yan-db = { path = "crates/yan-db" }
yan-ide = { path = "crates/yan-ide" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
