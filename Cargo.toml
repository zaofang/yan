[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0 WITH LLVM-exception"
publish = false

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yong-core = { path = "crates/yong-core" }
yong-diag = { path = "crates/yong-diag" }
yong-interp = { path = "crates/yong-interp" }
yong-check = { path = "crates/yong-check" }
yong-jian = { path = "crates/yong-jian" }
yong-wen = { path = "crates/yong-wen" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
