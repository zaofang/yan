name: cleanup
description: Prune a self-hosted runner's build output only when it has outgrown its share of the disk.
runs:
  using: composite
  steps:
    # Four runners share one disk. A warm target/ and cargo home are what make a job fast, so they stay
    # until target/ passes its cap or the disk fills. Never touches the checkout, ~/.cargo, ~/.elan or the runner config.
    - shell: bash
      env:
        TARGET_CAP_MIB: "20480"
        DISK_USED_PCT: "85"
      run: |
        target_mib=$(du -sm "$GITHUB_WORKSPACE/target" 2>/dev/null | cut -f1)
        disk_pct=$(df -P "$GITHUB_WORKSPACE" | awk 'NR==2 {print $5 + 0}')
        if [ "${target_mib:-0}" -ge "$TARGET_CAP_MIB" ] || [ "$disk_pct" -ge "$DISK_USED_PCT" ]; then
          echo "pruning: target ${target_mib:-0} MiB, disk ${disk_pct}% used"
          rm -rf "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/formal/.lake" "$CARGO_HOME"
        fi
