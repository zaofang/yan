# Weekly progress report (#1029, DL14): renders docs/reports/<date>-progress.md from the `status` artifact
# of the latest successful ci run on main and opens a PR. No figure is typed by hand.
name: progress-report

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Fetch status from the latest green ci run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          run=$(gh run list --workflow ci --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$run" --name status
          open=$(gh issue list --state open --limit 5000 --json number --jq length)
          closed=$(gh issue list --state closed --limit 5000 --json number --jq length)
          printf '{"open": %s, "closed": %s}\n' "$open" "$closed" > issues.json
      - name: Render the report
        run: uv run python -m tools.report --status status.json --github issues.json --out docs/reports
      - run: uv run python -m tools.lint_reports
      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          date=$(python3 -c 'import json; print(json.load(open("status.json"))["date"])')
          branch="report/$date"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "docs/reports/$date-progress.md"
          git commit -s -m "Progress report $date (generated)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Progress report $date" \
            --body "Generated by tools.report from the status artifact (#1029). Refs #351."
