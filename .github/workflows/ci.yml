name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One runner serves every run; a newer push to a PR replaces its older run.
# Other events get a group of their own, since a group keeps only one pending run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  guard:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject agent changes to tests and conformance
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          git diff --name-only --no-renames "$BASE...$HEAD" \
            | python3 tools/guard.py --branch "$BRANCH" --author-type "$AUTHOR_TYPE"

  canary:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Guard must reject a synthetic agent patch to tests/
        run: |
          if printf 'tests/canary.xin\n' | python3 tools/guard.py --branch agent/canary; then
            echo "guard accepted an agent patch to tests/" >&2
            exit 1
          fi

  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy tools
      - run: uv run pytest -q tools/selftest
      - run: uv run python tools/rows.py check

  rust:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  conformance:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: cargo build --locked --release -p yong-cli
      # Gate on the cases due by the milestone the implementation has reached (spec 23); raise it when a milestone starts.
      - run: >-
          uv run python tools/conform.py --json conformance-summary.json
          --milestone M0 --executor interp=target/release/yong
      # Round-trip laws 3 and 4 (16.5): reported, not gated, until M3 (R564).
      - run: >-
          uv run python tools/conform.py --laws --json laws-summary.json
          --executor interp=target/release/yong
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-summary
          path: |
            conformance-summary.json
            laws-summary.json

  # One run per program: checks that every benchmark still computes its result; times are indicative.
  bench:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: cargo build --locked --release -p yong-cli
      - run: uv run python bench/run.py --runs 1 --json bench-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-summary
          path: bench-summary.json
