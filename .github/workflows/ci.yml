name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject agent changes to tests, conformance and spec
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          git diff --name-only --no-renames "$BASE...$HEAD" \
            | python3 tools/guard.py --branch "$BRANCH" --author-type "$AUTHOR_TYPE"

  canary:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Guard must reject a synthetic agent patch to tests/
        run: |
          if printf 'tests/canary.jian\n' | python3 tools/guard.py --branch agent/canary; then
            echo "guard accepted an agent patch to tests/" >&2
            exit 1
          fi

  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy tools
      - run: uv run pytest -q tools/selftest

  conformance:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python tools/conform.py --json conformance-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-summary
          path: conformance-summary.json
