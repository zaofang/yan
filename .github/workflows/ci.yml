name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR replaces its older run.
# Other events get a group of their own, since a group keeps only one pending run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Every job runs on GitHub-hosted runners: the repo is public, so fork PRs must never reach a machine we own
# (#423, #461). Do not add a self-hosted label.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # A PR touching only spec/, rfcs/, docs/ or top-level Markdown skips the cargo jobs.
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only --no-renames "$BASE...$HEAD" \
              | grep -qvE '^(spec/|rfcs/|docs/|[^/]+\.md$)'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject agent changes to tests and conformance
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          git diff --name-only --no-renames "$BASE...$HEAD" \
            | python3 tools/guard.py --branch "$BRANCH" --author-type "$AUTHOR_TYPE" --author "$AUTHOR" --author-id "$AUTHOR_ID"

  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Guard must reject a synthetic agent patch to tests/
        run: |
          if printf 'tests/canary.yag\n' | python3 tools/guard.py --branch agent/canary; then
            echo "guard accepted an agent patch to tests/" >&2
            exit 1
          fi
          if printf 'tests/canary.yag\n' | python3 tools/guard.py --branch feature/x --author some-agent; then
            echo "guard accepted a non-lead author on a non-agent branch" >&2
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy tools
      - run: uv run pytest -q tools/selftest
      - run: uv run python tools/rows.py check
      - run: uv run python -m tools.lint_reports
      - run: uv run python -m tools.names_lint
      - run: uv run python -m tools.line_ratchet

  # The Lean model of the core (RFC 0022): it builds, and it agrees with the interpreter.
  formal:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Restores the dependency build main saved; only the rust job saves it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build
          save-if: false
      - name: Install Lean at the version formal/lean-toolchain pins
        run: |
          # Transient 5xx from the elan or toolchain host: retry the install (#761). A build failure is not retried.
          for i in 1 2 3; do
            curl -sSfL --retry 3 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 15))
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Fetches the pinned Lean toolchain on first use; retry only that fetch, not the build.
      - name: Fetch the Lean toolchain
        run: |
          for i in 1 2 3; do
            elan toolchain install "$(cat lean-toolchain)" && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 15))
          done
        working-directory: formal
      - run: lake build
        working-directory: formal
      - run: cargo build --locked --release -p yan-cli
      - run: uv sync --locked
      - run: uv run python formal/drt.py cases
      - run: uv run python formal/drt.py gen --count 300 --seed 1

  # Rust checks and conformance share one checkout and one build cache.
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Dependencies are cached from main; PRs restore and never save.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build
          save-if: true  # TEMP-MEASURE
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest@0.9.100
      # nextest builds only test targets; yan-cli's build tests need libyan_rt.a (a plain cargo test builds it as a side effect).
      - run: cargo build --locked -p yan-rt
      # nextest does not run doctests.
      - run: cargo nextest run --locked --no-fail-fast
      - run: cargo test --locked --doc
      - run: uv sync --locked
      - run: uv run python tools/third_party.py --check
      - run: cargo build --locked --release -p yan-cli
      # Gate on the cases due by the milestone the implementation has reached (spec 23); raise it when a milestone starts.
      - run: >-
          uv run python tools/conform.py --json conformance-summary.json
          --milestone M1 --executor interp=${{ github.workspace }}/target/release/yan
      # Round-trip laws 3 and 4 (16.5): reported, not gated, until M3 (R564).
      - run: >-
          uv run python tools/conform.py --laws --json laws-summary.json
          --executor interp=${{ github.workspace }}/target/release/yan
      # DL5 differential run: blocking. Divergences go in tools/difftest_allow.toml with an issue.
      - run: >-
          uv run python -m tools.difftest --json difftest-summary.json
          --yan ${{ github.workspace }}/target/release/yan
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-summary
          path: |
            conformance-summary.json
            laws-summary.json
            difftest-summary.json

  # One run per program: checks that every benchmark still computes its result; times are indicative.
  # Main pushes and the nightly run only.
  bench:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build
          save-if: false
      - run: uv sync --locked
      - run: cargo build --locked --release -p yan-cli
      - run: uv run python bench/run.py --runs 1 --json bench-summary.json
      # Every case, every milestone, for the status page; the M1 gate stays in the rust job.
      - run: >-
          uv run python tools/conform.py --report-only --json conformance-all.json
          --executor interp=${{ github.workspace }}/target/release/yan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-summary
          path: |
            bench-summary.json
            conformance-all.json

  # Status page data (#871): CI figures plus spec debt, stamped with commit and date (law 14).
  status:
    needs: [rust, bench]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conformance-summary
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bench-summary
      - run: >-
          uv run python -m tools.status --conformance conformance-all.json
          --difftest difftest-summary.json --bench bench-summary.json --out status.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status
          path: status.json
