name: site-inputs

# Publishes what zaofang/yanlang.dev builds the website from, as the rolling `site-inputs` release,
# after each green ci run on main (push or nightly): the playground with a fresh yan.wasm, brand
# files, a yan binary to check the tour with, and the status figures (tools/site_inputs.py). The site
# repository fetches the release at build; it rebuilds on a schedule, and when SITE_DISPATCH_TOKEN
# is set this job also triggers it at once.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A ci run that finishes later (often a red one whose build is skipped) must not cancel a publish.
  group: site-inputs
  cancel-in-progress: false

env:
  WASI_SYSROOT_VERSION: "25"

jobs:
  publish:
    # A fork PR can name its branch main, so the event is checked as well as the branch.
    if: >-
      github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success'
      && contains(fromJSON('["push", "schedule"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: wasi-libc headers
        run: |
          dir="$RUNNER_TOOL_CACHE/wasi-sysroot-$WASI_SYSROOT_VERSION"
          if [ ! -d "$dir" ]; then
            mkdir -p "$dir"
            curl -fsSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$WASI_SYSROOT_VERSION/wasi-sysroot-$WASI_SYSROOT_VERSION.0.tar.gz" \
              | tar xz -C "$dir" --strip-components=1
          fi
          # shellcheck disable=SC2012 # one directory name from a fixed sysroot
          echo "WASI_INCLUDE=$(ls -d "$dir"/include/wasm32-wasi* | head -n1)" >> "$GITHUB_ENV"
          clang --print-targets | grep -q wasm32 || { echo "clang has no wasm32 backend"; exit 1; }
      - run: rustup target add wasm32-wasip1
      - run: ./playground/build.sh
      - run: cargo build --release -p yan-cli -p yan-rt
      - if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: status
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: uv sync --locked
      - run: >-
          uv run python -m tools.site_inputs site-inputs.tar.gz --bin-dir target/release
          ${{ github.event_name == 'workflow_run' && '--status status.json' || '' }}
      - name: Publish the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view site-inputs >/dev/null 2>&1 || gh release create site-inputs \
            --prerelease --latest=false --target "$GITHUB_SHA" --title "Website inputs" \
            --notes "Rolling inputs for zaofang/yanlang.dev (tools/site_inputs.py). Not a Yan release."
          gh release upload site-inputs site-inputs.tar.gz --clobber
      - name: Trigger the site build
        if: env.SITE_DISPATCH_TOKEN != ''
        run: >-
          curl -fsS -X POST -H "Authorization: Bearer $SITE_DISPATCH_TOKEN"
          -H "Accept: application/vnd.github+json"
          https://api.github.com/repos/zaofang/yanlang.dev/dispatches
          -d '{"event_type":"yan-site-inputs"}'
