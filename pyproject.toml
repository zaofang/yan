[project]
name = "yan-workspace"
version = "0.0.0"
requires-python = "==3.14.*"

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.14"
